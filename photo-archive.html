    <style>
        .hero-bg {
            background: linear-gradient(135deg, rgba(196, 30, 58, 0.1) 0%, rgba(255, 255, 255, 0.9) 100%),
                        url('resources/hero-campus.png') center/cover;
            min-height: 100vh;
        }
        
        .auth-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(196, 30, 58, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #C41E3A 0%, #A01729 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(196, 30, 58, 0.3);
        }
        
        .btn-wechat {
            background: #07C160;
            transition: all 0.3s ease;
        }
        
        .btn-wechat:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(7, 193, 96, 0.3);
        }
        
        .form-input {
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #C41E3A;
            box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.1);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .toast-success { background: #10b981; }
        .toast-error { background: #ef4444; }
        .toast-info { background: #3b82f6; }
        
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
        }
        
        .logo-container {
            background: white;
            border-radius: 50%;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .typewriter-text {
            border-right: 2px solid #C41E3A;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { border-color: #C41E3A; }
            51%, 100% { border-color: transparent; }
        }
        
        /* 上传区域样式 */
        .upload-area {
            border: 2px dashed #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .upload-area:hover, .upload-area.drag-over {
            border-color: #C41E3A;
            background-color: rgba(196, 30, 58, 0.05);
        }
        
        .upload-preview {
            height: 120px;
            object-fit: cover;
        }
        
        .progress-bar {
            height: 4px;
            background: linear-gradient(90deg, #C41E3A 0%, #A01729 100%);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        /* 切换动画 */
        .auth-tab {
            transition: all 0.3s ease;
        }
        
        .auth-tab.active {
            color: #C41E3A;
            font-weight: 600;
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 底部导航 */
        .nav-item {
            transition: all 0.3s ease;
        }
        
        .nav-item:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

        // 全局对象管理系统功能
        const photoArchive = {
            // 当前登录用户
            currentUser: null,
            
            // 显示提示信息
            showToast: function(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                
                // 显示动画
                setTimeout(() => toast.classList.add('show'), 10);
                
                // 3秒后隐藏
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            },
            
            // 登录功能
            login: function(username, password) {
                // 模拟登录验证
                if ((username === 'admin' && password === 'password123') || 
                    (username === 'user' && password === 'password123')) {
                    this.currentUser = {
                        username: username,
                        displayName: username === 'admin' ? '管理员' : '普通用户',
                        role: username === 'admin' ? 'admin' : 'user'
                    };
                    localStorage.setItem('currentUser', JSON.stringify(this.currentUser));
                    return { success: true };
                } else {
                    return { success: false, message: '用户名或密码错误' };
                }
            },
            
            // 注册功能
            register: function(username, email, password) {
                // 模拟注册逻辑
                if (username && email && password) {
                    this.currentUser = {
                        username: username,
                        displayName: username,
                        email: email,
                        role: 'user'
                    };
                    localStorage.setItem('currentUser', JSON.stringify(this.currentUser));
                    return { success: true };
                } else {
                    return { success: false, message: '请填写完整信息' };
                }
            },
            
            // 微信登录
            wechatLogin: function() {
                // 模拟微信登录流程
                this.showToast('正在唤起微信登录...', 'info');
                
                setTimeout(() => {
                    this.currentUser = {
                        username: 'wechat_' + Math.random().toString(36).substr(2, 9),
                        displayName: '微信用户',
                        role: 'user',
                        wechatBound: true
                    };
                    localStorage.setItem('currentUser', JSON.stringify(this.currentUser));
                    this.showToast('微信登录成功', 'success');
                    
                    setTimeout(() => {
                        this.switchToUploadSection();
                    }, 1000);
                }, 1500);
            },
            
            // 退出登录
            logout: function() {
                this.currentUser = null;
                localStorage.removeItem('currentUser');
                this.switchToAuthSection();
                this.showToast('已退出登录', 'info');
            },
            
            // 切换到认证页面
            switchToAuthSection: function() {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('uploadSection').classList.add('hidden');
                document.getElementById('bottomNav').classList.add('hidden');
            },
            
            // 切换到上传页面
            switchToUploadSection: function() {
                if (this.currentUser) {
                    document.getElementById('userDisplayName').textContent = this.currentUser.displayName;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('uploadSection').classList.remove('hidden');
                    document.getElementById('bottomNav').classList.remove('hidden');
                    
                    // 加载上传历史
                    this.loadUploadHistory();
                }
            },
            
            // 加载上传历史
            loadUploadHistory: function() {
                const historyContainer = document.getElementById('uploadHistory');
                historyContainer.innerHTML = '';
                
                // 模拟历史数据
                const history = [
                    { id: 1, src: 'https://picsum.photos/200/200?random=1', date: '今天', title: '学术研讨会' },
                    { id: 2, src: 'https://picsum.photos/200/200?random=2', date: '昨天', title: '校园开放日' },
                    { id: 3, src: 'https://picsum.photos/200/200?random=3', date: '3天前', title: '新生开学典礼' },
                    { id: 4, src: 'https://picsum.photos/200/200?random=4', date: '1周前', title: '校友座谈会' }
                ];
                
                history.forEach(item => {
                    const itemEl = document.createElement('div');
                    itemEl.className = 'relative group';
                    itemEl.innerHTML = `
                        <img src="${item.src}" alt="${item.title}" class="w-full h-24 object-cover rounded-lg">
                        <div class="absolute inset-0 bg-black bg-opacity-50 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="text-white text-xs">查看详情</span>
                        </div>
                        <div class="mt-1 text-xs text-gray-600">${item.date}</div>
                        <div class="text-xs text-gray-800 truncate">${item.title}</div>
                    `;
                    historyContainer.appendChild(itemEl);
                });
            },
            
            // 初始化上传功能
            initUpload: function() {
                const dropArea = document.getElementById('dropArea');
                const fileInput = document.getElementById('fileInput');
                const browseBtn = document.getElementById('browseBtn');
                const previewContainer = document.getElementById('previewContainer');
                const photosPreview = document.getElementById('photosPreview');
                const confirmUpload = document.getElementById('confirmUpload');
                const cancelUpload = document.getElementById('cancelUpload');
                const uploadProgress = document.getElementById('uploadProgress');
                const progressBar = document.getElementById('progressBar');
                const progressText = document.getElementById('progressText');
                const progressPercent = document.getElementById('progressPercent');
                
                // 浏览文件
                browseBtn.addEventListener('click', () => fileInput.click());
                
                // 文件选择
                fileInput.addEventListener('change', (e) => {
                    this.handleFiles(e.target.files);
                });
                
                // 拖放功能
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropArea.addEventListener(eventName, preventDefaults, false);
                });
                
                function preventDefaults(e) {
                    e.preventDefault();
                    e.stopPropagation();
                }
                
                ['dragenter', 'dragover'].forEach(eventName => {
                    dropArea.addEventListener(eventName, highlight, false);
                });
                
                ['dragleave', 'drop'].forEach(eventName => {
                    dropArea.addEventListener(eventName, unhighlight, false);
                });
                
                function highlight() {
                    dropArea.classList.add('drag-over');
                }
                
                function unhighlight() {
                    dropArea.classList.remove('drag-over');
                }
                
                dropArea.addEventListener('drop', (e) => {
                    const dt = e.dataTransfer;
                    const files = dt.files;
                    this.handleFiles(files);
                }, false);
                
                // 处理选择的文件
                this.handleFiles = function(files) {
                    if (files.length === 0) return;
                    
                    // 显示预览容器
                    previewContainer.classList.remove('hidden');
                    photosPreview.innerHTML = '';
                    
                    // 预览图片
                    Array.from(files).forEach((file, index) => {
                        if (!file.type.match('image.*')) {
                            photoArchive.showToast('请选择图片文件', 'error');
                            return;
                        }
                        
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const preview = document.createElement('div');
                            preview.className = 'relative group';
                            preview.innerHTML = `
                                <img src="${e.target.result}" alt="预览图" class="upload-preview w-full rounded-lg">
                                <button class="absolute top-1 right-1 bg-white bg-opacity-80 rounded-full w-6 h-6 flex items-center justify-center text-gray-600 hover:text-academic-red remove-photo" data-index="${index}">
                                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                                    </svg>
                                </button>
                            `;
                            photosPreview.appendChild(preview);
                            
                            // 添加删除功能
                            preview.querySelector('.remove-photo').addEventListener('click', function() {
                                preview.remove();
                                if (photosPreview.children.length === 0) {
                                    previewContainer.classList.add('hidden');
                                }
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                };
                
                // 确认上传
                confirmUpload.addEventListener('click', () => {
                    // 检查是否填写了标题
                    if (!document.getElementById('photoTitle').value.trim()) {
                        this.showToast('请输入照片标题', 'error');
                        return;
                    }
                    
                    // 显示进度条
                    uploadProgress.classList.remove('hidden');
                    confirmUpload.disabled = true;
                    cancelUpload.disabled = true;
                    
                    // 模拟上传进度
                    let progress = 0;
                    const interval = setInterval(() => {
                        progress += 5;
                        progressBar.style.width = `${progress}%`;
                        progressPercent.textContent = `${progress}%`;
                        
                        if (progress >= 100) {
                            clearInterval(interval);
                            progressText.textContent = '上传完成';
                            
                            // 显示成功消息
                            setTimeout(() => {
                                this.showToast('照片上传成功', 'success');
                                previewContainer.classList.add('hidden');
                                uploadProgress.classList.add('hidden');
                                progressBar.style.width = '0%';
                                confirmUpload.disabled = false;
                                cancelUpload.disabled = false;
                                
                                // 重置表单
                                document.getElementById('photoTitle').value = '';
                                document.getElementById('photoDescription').value = '';
                                document.getElementById('photoTags').value = '';
                                
                                // 刷新历史记录
                                this.loadUploadHistory();
                            }, 500);
                        }
                    }, 150);
                });
                
                // 取消上传
                cancelUpload.addEventListener('click', () => {
                    previewContainer.classList.add('hidden');
                    photosPreview.innerHTML = '';
                    
                    // 重置表单
                    document.getElementById('photoTitle').value = '';
                    document.getElementById('photoDescription').value = '';
                    document.getElementById('photoTags').value = '';
                });
            },
            
            // 初始化页面
            init: function() {
                // 检查是否已登录
                const savedUser = localStorage.getItem('currentUser');
                if (savedUser) {
                    this.currentUser = JSON.parse(savedUser);
                    this.switchToUploadSection();
                }
                
                // 初始化打字机效果
                const typewriter = new Typed('#typewriter', {
                    strings: [
                        '照片档案管理系统',
                        '校园活动记录平台',
                        '新闻图片存储中心',
                        '学术资源共享库'
                    ],
                    typeSpeed: 80,
                    backSpeed: 50,
                    backDelay: 2000,
                    loop: true,
                    showCursor: false
                });
                
                // 初始化选项卡切换
                const authTabs = document.querySelectorAll('.auth-tab');
                authTabs.forEach(tab => {
                    tab.addEventListener('click', function() {
                        const tabName = this.getAttribute('data-tab');
                        
                        // 更新选项卡状态
                        authTabs.forEach(t => t.classList.remove('active'));
                        this.classList.add('active');
                        
                        // 更新内容区域
                        document.querySelectorAll('.tab-content').forEach(content => {
                            content.classList.remove('active');
                        });
                        document.getElementById(`${tabName}Tab`).classList.add('active');
                    });
                });
                
                // 登录表单提交
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('loginUsername').value;
                    const password = document.getElementById('loginPassword').value;
                    
                    if (!username || !password) {
                        this.showToast('请填写用户名和密码', 'error');
                        return;
                    }
                    
                    const result = this.login(username, password);
                    
                    if (result.success) {
                        this.showToast('登录成功！正在跳转...', 'success');
                        
                        // 登录动画
                        anime({
                            targets: '.auth-card',
                            scale: [1, 0.95],
                            opacity: [1, 0.8],
                            duration: 300,
                            easing: 'easeOutQuart',
                            complete: () => {
                                setTimeout(() => {
                                    this.switchToUploadSection();
                                }, 500);
                            }
                        });
                    } else {
                        this.showToast(result.message, 'error');
                        
                        // 错误动画
                        anime({
                            targets: '.auth-card',
                            translateX: [0, -10, 10, -10, 10, 0],
                            duration: 500,
                            easing: 'easeOutQuart'
                        });
                    }
                });
                
                // 注册表单提交
                document.getElementById('registerForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const username = document.getElementById('regUsername').value;
                    const email = document.getElementById('regEmail').value;
                    const password = document.getElementById('regPassword').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    
                    if (password !== confirmPassword) {
                        this.showToast('两次输入的密码不一致', 'error');
                        return;
                    }
                    
                    const result = this.register(username, email, password);
                    
                    if (result.success) {
                        this.showToast('注册成功！正在跳转...', 'success');
                        
                        // 注册动画
                        anime({
                            targets: '.auth-card',
                            scale: [1, 0.95],
                            opacity: [1, 0.8],
                            duration: 300,
                            easing: 'easeOutQuart',
                            complete: () => {
                                setTimeout(() => {
                                    this.switchToUploadSection();
                                }, 500);
                            }
                        });
                    } else {
                        this.showToast(result.message, 'error');
                    }
                });
                
                // 微信登录
                document.getElementById('wechatLogin').addEventListener('click', () => {
                    this.wechatLogin();
                });
                
                // 微信注册
                document.getElementById('wechatRegister').addEventListener('click', () => {
                    this.wechatLogin();
                });
                
                // 退出登录
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    this.logout();
                });
                
                // 初始化输入框动画
                const inputs = document.querySelectorAll('.form-input');
                inputs.forEach(input => {
                    input.addEventListener('focus', function() {
                        anime({
                            targets: this,
                            scale: [1, 1.02],
                            duration: 200,
                            easing: 'easeOutQuart'
                        });
                    });
                    
                    input.addEventListener('blur', function() {
                        anime({
                            targets: this,
                            scale: [1.02, 1],
                            duration: 200,
                            easing: 'easeOutQuart'
                        });
                    });
                });
                
                // 初始化上传功能
                this.initUpload();
            }
        };
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            photoArchive.init();
        });
    </script>
</body>
</html>
